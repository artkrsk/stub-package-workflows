name: Stub Release

# Reusable release workflow: on a v* tag push, publish a GitHub release.
# Tags follow vBASE(.N) — the optional .N suffix marks a stub-content-only
# patch against the same upstream version (v3.8.11.1 is still "3.8.11").

on:
  workflow_call:
    inputs:
      release_title:
        description: 'Human name of the stubbed software, e.g. "Elementor"'
        required: true
        type: string
      runner:
        description: 'Runner label'
        required: false
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Disable git hooks
        run: git config --global core.hooksPath /dev/null

      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Base version: v3.33.6 or v3.33.6.1 -> 3.33.6
          VERSION=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ inputs.release_title }} ${{ steps.version.outputs.version }} Stubs" \
            --generate-notes \
            --verify-tag
